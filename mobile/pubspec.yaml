name: campus_secure
description: "Campus Secure - Mobile Application Frontend for Trichy SRM Medical College Hospital & Research Centre"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/srm-trichy-emblem.png
    - assets/images/srm-trichy-logo.png
    - assets/images/srm-trichy-full.png
    - assets/images/srm-trichy-wordings.png
